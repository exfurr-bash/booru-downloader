name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # <--- Isso libera o botão de "Run workflow" no GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Define os sistemas operacionais que o GitHub vai subir
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        # O comando é o mesmo, o PyInstaller detecta o OS atual
        run: pyinstaller rule34_gui.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # Nome dinâmico para não sobrescrever um ao outro
          name: rule34-gui-${{ matrix.os }}
          path: dist/
