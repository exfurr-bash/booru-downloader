name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: rule34_gui-windows.exe
            dist_path: dist/rule34_gui.exe
          - os: ubuntu-latest
            artifact_name: rule34_gui-linux
            dist_path: dist/rule34_gui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller rule34_gui.spec

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p upload
          # Verifica se o arquivo foi gerado antes de mover
          if [ -f "${{ matrix.dist_path }}" ]; then
            mv "${{ matrix.dist_path }}" "upload/${{ matrix.artifact_name }}"
          else
            echo "Error: Binary not found at ${{ matrix.dist_path }}"
            exit 1
          fi

      - name: Upload Intermediate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: upload/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-bins
          merge-multiple: true

      - name: Post Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-bins/rule34_gui-windows.exe
            all-bins/rule34_gui-linux
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
