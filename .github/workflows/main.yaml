name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara quando você criar uma tag (ex: v1.0.2)

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller rule34_gui.spec

      # Passo importante: renomear os arquivos para não ficarem com o mesmo nome
      - name: Rename binaries
        shell: bash
        run: |
          mkdir -p output
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/rule34_gui.exe output/rule34_gui-windows.exe
          else
            mv dist/rule34_gui output/rule34_gui-linux
          fi

      - name: Upload Artifacts (Internal)
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: output/

  release:
    name: Create Release
    needs: build # Só roda se o build terminar com sucesso
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para o GitHub permitir criar o Release
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-binaries/rule34_gui-windows.exe
            all-binaries/rule34_gui-linux
          draft: false
          prerelease: false
          generate_release_notes: true # Cria a lista de mudanças automaticamente
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
